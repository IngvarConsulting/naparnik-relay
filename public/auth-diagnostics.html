<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Диагностика авторизации · Напарник</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/auth-diagnostics.js"></script>
  </head>
  <body>
    <main class="diagnostics-page" aria-labelledby="diagnostic-title">
      <header class="panel-heading">
        <h1 id="diagnostic-title">Диагностика авторизации</h1>
        <time id="diagnostic-time" hidden></time>
      </header>
      <p class="panel-feedback" id="diagnostic-feedback" role="status">Загружаем сведения…</p>
      <div id="diagnostic-exchange" hidden>
        <p class="panel-error" id="diagnostic-error"></p>
        <section aria-labelledby="diagnostic-request-title">
          <h2 id="diagnostic-request-title">Запрос к Напарнику</h2>
          <div id="diagnostic-request"></div>
        </section>
        <section id="diagnostic-response-section" aria-labelledby="diagnostic-response-title" hidden>
          <header class="section-head">
            <h2 id="diagnostic-response-title">Ответ Напарника</h2>
            <code id="diagnostic-status"></code>
          </header>
          <div id="diagnostic-response"></div>
        </section>
      </div>
    </main>
  </body>
</html>
