<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f3" />
    <title>Напарник · Локальный шлюз</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main id="home">
      <header class="top">
        <h1>Напарник</h1>
        <button id="manage" class="status" title="Настроить аккаунт" disabled>
          <i id="signal" aria-hidden="true"></i><span id="headline">Проверяем…</span>
        </button>
      </header>
      <p id="subtitle" role="status" hidden></p>
      <div class="switch" role="group" aria-label="Клиент">
        <button id="zcode" aria-pressed="true" aria-describedby="zcode-protocol">ZCode</button>
        <button id="dsh" aria-pressed="false" aria-describedby="dsh-protocol">DeepSeek Harness</button>
      </div>
      <div class="protocols"><small id="zcode-protocol">OpenAI Chat Completions</small><small id="dsh-protocol">Anthropic Messages</small></div>
      <div class="fields">
        <button class="field address copy" data-copy="url" aria-label="Копировать Base URL" disabled>
          <span>Base URL</span><code id="url">—</code><i aria-hidden="true"></i>
        </button>
        <button class="field copy" data-copy="model" aria-label="Копировать Model ID" disabled>
          <span>Model ID</span><code id="model">—</code><i aria-hidden="true"></i>
        </button>
        <button class="field copy" data-copy="key" aria-label="Копировать локальный API key" disabled>
          <span>API key</span><code id="key">•••• ••••</code><i aria-hidden="true"></i>
        </button>
      </div>
      <footer>
        <a href="https://ingvar.pro/?utm_source=naparnik_relay&amp;utm_medium=app&amp;utm_campaign=about" rel="noreferrer"><img src="/ingvar-consulting.png" width="111" height="20" alt="Ingvar Consulting" /></a>
        <details id="quota">
          <summary aria-label="Лимиты Напарника">
            <svg viewBox="0 0 32 32" width="27" height="27" fill="none" aria-hidden="true">
              <g transform="rotate(-90 16 16)" stroke-width="3">
                <circle class="track" cx="16" cy="16" r="13"/>
                <circle class="five-hour" id="hours-ring" cx="16" cy="16" r="13" pathLength="100" stroke-dasharray="0 100"/>
                <circle class="track" cx="16" cy="16" r="8"/>
                <circle class="weekly" id="week-ring" cx="16" cy="16" r="8" pathLength="100" stroke-dasharray="0 100"/>
              </g>
            </svg>
            Лимиты
          </summary>
          <div class="quota-panel">
            <div class="section-head"><h2>Использовано</h2><button id="refresh" class="quiet" hidden>Обновить</button></div>
            <div class="meter"><div><span>За 5 часов</span><strong id="hours-value">—</strong></div><progress id="hours" max="100" value="0" aria-label="Использовано за 5 часов"></progress><small id="hours-reset"></small></div>
            <div class="meter"><div><span>За неделю</span><strong id="week-value">—</strong></div><progress id="week" max="100" value="0" aria-label="Использовано за неделю"></progress><small id="week-reset"></small></div>
            <small id="quota-note"></small>
          </div>
        </details>
      </footer>
    </main>
    <main id="auth" hidden aria-labelledby="auth-title">
      <header class="top">
        <h1 id="auth-title" tabindex="-1">Авторизация</h1>
        <a class="quiet" id="back" href="#home">Назад</a>
      </header>
      <div class="auth-overview"><p id="auth-state"></p><button type="button" class="unlink" id="unlink" hidden>Отключить аккаунт</button></div>
      <form id="account">
        <div class="key-label"><label for="secret">API-ключ Напарника</label><a href="https://code.1c.ai/api-access/" rel="noreferrer">Получить ключ ↗</a></div>
        <input id="secret" type="password" placeholder="Вставьте ключ" autocomplete="off" spellcheck="false" required>
        <p class="error" id="error" role="alert"></p>
        <div class="form-actions">
          <button type="submit" class="primary" id="connect">Подключить</button>
          <label class="remember"><input id="remember" type="checkbox" checked>Запомнить на этом компьютере</label>
        </div>
      </form>
    </main>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
